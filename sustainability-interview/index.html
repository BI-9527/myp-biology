<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sustainability Staff Interview — Al Hayat International School</title>
<meta name="description" content="Staff interview on biodegradation and sustainable development at Al Hayat International School, Aramoun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 26C6 14 14 6 27 5c-1 13-9 21-21 21z' fill='%232f6b3a'/></svg>">
<style>
:root{
  --bg:#f6f4ee; --surface:#fffdf8; --surface-2:#efece3; --ink:#1d2a20; --ink-2:#4d5a4f; --muted:#7b857b;
  --line:#dcd8cc; --accent:#2f6b3a; --accent-ink:#ffffff; --accent-soft:#e3eedd; --warn:#a4471f; --focus:#2a78d6;
  --radius:14px; --shadow:0 1px 2px rgba(30,40,30,.06),0 6px 24px rgba(30,40,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a15; --surface:#1b231d; --surface-2:#232d25; --ink:#eef1ea; --ink-2:#c3cbc0; --muted:#8d998c;
  --line:#2f3b31; --accent:#7fbf7a; --accent-ink:#0f1a10; --accent-soft:#25382a; --warn:#f08a5d; --focus:#6da7ec;
  --shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#141a15; --surface:#1b231d; --surface-2:#232d25; --ink:#eef1ea; --ink-2:#c3cbc0; --muted:#8d998c;
  --line:#2f3b31; --accent:#7fbf7a; --accent-ink:#0f1a10; --accent-soft:#25382a; --warn:#f08a5d; --focus:#6da7ec; --shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:72px;scroll-padding-bottom:96px}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.logo{width:48px;height:48px;object-fit:contain;flex:none}
.brand small{display:block;color:var(--muted);font-size:13px}
.brand b{font-family:Fraunces,serif;font-weight:650;font-size:17px}
.testbadge{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:99px;background:#fbe7c6;color:#6b4300;white-space:nowrap}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--accent)} .steps i.cur{background:var(--accent);opacity:.45}
.progress .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
main{padding:28px 0 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.hero h1{font-size:clamp(28px,5vw,38px);line-height:1.15;margin:6px 0 14px}
.eyebrow{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:14px;margin:18px 0}
.meta span{display:flex;gap:6px;align-items:center}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:14px;margin:18px 0;font-size:14px;color:var(--ink-2);cursor:pointer}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--accent);padding:8px 4px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec-head{margin-bottom:22px}
.sec-head h2{font-size:clamp(24px,4vw,30px);display:flex;gap:12px;align-items:center}
.sec-head p{color:var(--ink-2);margin:6px 0 0}
.sec-ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.q{padding:22px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none;padding-top:4px}
.q-text{font-weight:600;font-size:16.5px;margin-bottom:4px}
.q-text .req{color:var(--warn);margin-left:3px}
.q-help{color:var(--muted);font-size:14px;margin-bottom:10px}
.q-err{color:var(--warn);font-size:14px;margin-top:8px;display:none}
.q.invalid .q-err{display:block}
.q.invalid .opts,.q.invalid textarea,.q.invalid input[type=text]{outline:1.5px solid var(--warn);outline-offset:3px;border-radius:10px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.dk{border-style:dashed;color:var(--ink-2)}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);margin-top:10px}
textarea{min-height:120px;resize:vertical}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.gridq{margin-top:10px;display:grid;gap:10px}
.grow{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.grow .rl{font-size:15px;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:block;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;background:var(--surface);cursor:pointer;white-space:nowrap}
.pill input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.pill.dk span{border-style:dashed;color:var(--ink-2)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.scale .pill span{text-align:center;padding:10px 0}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px;gap:10px}
.saved{font-size:13px;color:var(--muted)}
.review-sec{padding:16px 0;border-top:1px solid var(--line)}
.review-sec h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.review-sec dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:14px}
.review-sec dt{color:var(--muted)} .review-sec dd{margin:0;word-break:break-word}
.review-sec dd.miss{color:var(--warn)}
.done-ico{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
@media (max-width:560px){.card{padding:20px 16px}.scale{grid-template-columns:repeat(5,1fr)}.review-sec dl{grid-template-columns:1fr}.review-sec dd{margin-bottom:6px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
  <div class="brand"><b>Al Hayat International School</b><small>Aramoun · Student research project</small></div>
  <span class="testbadge" id="testbadge" hidden>Test mode — answers not sent</span>
</div></header>

<div class="progress" id="progress" hidden><div class="wrap">
  <div class="steps" id="steps"></div>
  <div class="lbl"><span id="plabel"></span><span id="pcount"></span></div>
</div></div>

<main><div class="wrap" id="app"></div></main>

<nav class="nav" id="nav" hidden><div class="wrap">
  <button class="btn" id="back">← Back</button>
  <span class="saved" id="saved"></span>
  <button class="btn primary" id="next">Next →</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="questions.js"></script>
<script>
(() => {
const S = window.SURVEY, CFG = window.CONFIG || {};
const STORE = 'ahis-biodeg-interview-v1';
const ICONS = {
  person:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  leaf:'<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15zM5 19l7-7"/>',
  flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/>',
  recycle:'<path d="M7 19H4l3-5M17 19h3l-3-5M12 4l-2 3.5M12 4l2 3.5M8 12l-2 3M16 12l2 3M9 19h6"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  tree:'<path d="M12 22v-7M12 3a6 6 0 0 0-6 6 5 5 0 0 0 3 4.6V15h6v-1.4A5 5 0 0 0 18 9a6 6 0 0 0-6-6z"/>',
  people:'<path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8 0a3 3 0 1 0 0-6M3 20a6 6 0 0 1 12 0m2-5a5 5 0 0 1 4 5"/>',
  flag:'<path d="M5 21V4m0 0h11l-2 4 2 4H5"/>',
  check:'<path d="m5 12 5 5 9-10"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const ico = (n, s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isExclusive = (q, label, score) => label === "Don't know" || /^(None|Nothing|No verification)/.test(label) || (q.type==='multi' && score === 0);
const testMode = !CFG.SCRIPT_URL;
if (testMode) document.getElementById('testbadge').hidden = false;

const state = load() || { step: -1, answers: {}, id: uid(), started: null, consent: false, submitted: false };
function uid(){ return 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function load(){ try { return JSON.parse(localStorage.getItem(STORE)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); flashSaved(); } catch(e){} }
let savedTimer; function flashSaved(){ const el=document.getElementById('saved'); el.textContent='Saved on this device'; clearTimeout(savedTimer); savedTimer=setTimeout(()=>el.textContent='',1800); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

const app = document.getElementById('app');
const nSec = S.sections.length;               // review screen = step nSec, done = nSec+1

/* ---------------------------------------------------------- rendering */
function render(){
  const st = state.step;
  document.getElementById('progress').hidden = st < 0 || st > nSec;
  document.getElementById('nav').hidden = st < 0 || st > nSec;
  if (st < 0) return renderWelcome();
  if (st === nSec) return renderReview();
  if (st > nSec) return renderDone();
  renderSection(S.sections[st]);
}

function renderWelcome(){
  const resume = Object.keys(state.answers).length > 0 && !state.submitted;
  const nq = S.sections.reduce((a,s)=>a+s.questions.length,0);
  app.innerHTML = `<div class="card hero">
    <div class="eyebrow">${esc(S.subtitle)}</div>
    <h1>${esc(S.title)}</h1>
    <p>${esc(S.intro)}</p>
    <div class="meta"><span>${ico('clock',18)} ${S.minutes} minutes</span><span>${ico('list',18)} ${nq} questions · ${nSec} parts</span><span>${ico('lock',18)} Saved as you go</span></div>
    ${state.submitted ? `<p class="q-help"><b>You have already submitted from this device.</b> If someone else is using this device, they can start a fresh interview below.</p>` : ''}
    <label class="consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>${esc(S.consent)}</span></label>
    <div class="row">
      <button class="btn primary" id="start" ${state.consent?'':'disabled'}>${resume ? 'Continue where you left off →' : 'Start the interview →'}</button>
      ${resume || state.submitted ? `<button class="btn link" id="fresh">Start a new, blank interview</button>`:''}
    </div>
  </div>
  <p class="foot">${esc(S.school)} · v${esc(S.version)}</p>`;
  const c = document.getElementById('consent'), b = document.getElementById('start');
  c.onchange = () => { state.consent = c.checked; b.disabled = !c.checked; save(); };
  b.onclick = () => { if (!state.started) state.started = Date.now(); state.step = resume ? Math.max(0, Math.min(state.step, nSec)) : 0; if (state.step<0) state.step=0; go(); };
  const f = document.getElementById('fresh');
  if (f) f.onclick = () => { if (!confirm('Clear the answers on this device and start again?')) return;
    Object.assign(state,{ step:-1, answers:{}, id:uid(), started:null, consent:false, submitted:false }); save(); render(); };
}

function steps(){
  const el = document.getElementById('steps');
  el.innerHTML = S.sections.map((s,i)=>`<i class="${i<state.step?'done':i===state.step?'cur':''}" title="${esc(s.title)}"></i>`).join('') + `<i class="${state.step===nSec?'cur':''}" title="Review"></i>`;
  document.getElementById('plabel').textContent = state.step < nSec ? `Part ${state.step+1} of ${nSec} · ${S.sections[state.step].title}` : 'Review & submit';
  const pct = Math.round(100 * answeredRequired() / totalRequired());
  document.getElementById('pcount').textContent = `${pct}% complete`;
}

function renderSection(sec){
  steps();
  app.innerHTML = `<div class="card">
    <div class="sec-head"><h2><span class="sec-ico">${ico(sec.icon,22)}</span>${esc(sec.title)}</h2><p>${esc(sec.intro||'')}</p></div>
    ${sec.questions.map(renderQ).join('')}
  </div>`;
  bind(sec);
  document.getElementById('back').textContent = state.step === 0 ? '← Introduction' : '← Back';
  document.getElementById('next').textContent = state.step === nSec-1 ? 'Review answers →' : 'Next →';
}

function renderQ(q){
  const a = state.answers, req = q.required ? '<span class="req" aria-hidden="true">*</span>' : '';
  let body = '';
  if (q.type === 'text') body = `<input type="text" id="in-${q.id}" data-k="${q.id}" value="${esc(a[q.id]||'')}" autocomplete="off">`;
  else if (q.type === 'textarea') body = `<textarea id="in-${q.id}" data-k="${q.id}" maxlength="3000" placeholder="Type your answer…">${esc(a[q.id]||'')}</textarea><div class="count"><span data-count="${q.id}">${(a[q.id]||'').length}</span>/3000</div>`;
  else if (q.type === 'single' || q.type === 'multi') {
    const multi = q.type==='multi', cur = a[q.id] || (multi?[]:'');
    body = `<div class="opts" role="${multi?'group':'radiogroup'}" aria-labelledby="t-${q.id}">` + q.options.map(([l,sc],i)=>{
      const on = multi ? cur.includes(l) : cur===l, dk = l==="Don't know"||l==='Undecided';
      return `<label class="opt ${on?'on':''} ${dk?'dk':''}"><input type="${multi?'checkbox':'radio'}" name="${q.id}" value="${esc(l)}" data-k="${q.id}" data-x="${isExclusive(q,l,sc)?1:0}" ${on?'checked':''}><span>${esc(l)}</span></label>`;
    }).join('') + `</div>`;
  }
  else if (q.type === 'grid' || q.type === 'likert') {
    body = `<div class="gridq">` + q.rows.map(([rk,rl])=>{
      const key = `${q.id}_${rk}`;
      return `<div class="grow" role="radiogroup" aria-label="${esc(rl)}"><div class="rl">${esc(rl)}</div><div class="pills">` + q.cols.map(([cl])=>
        `<label class="pill ${cl==="Don't know"?'dk':''}"><input type="radio" name="${key}" value="${esc(cl)}" data-k="${key}" ${a[key]===cl?'checked':''}><span>${esc(cl)}</span></label>`).join('') + `</div></div>`;
    }).join('') + `</div>`;
  }
  else if (q.type === 'scale') {
    body = `<div class="scale" role="radiogroup" aria-labelledby="t-${q.id}">` + Array.from({length:q.max-q.min+1},(_,i)=>q.min+i).map(n=>
      `<label class="pill"><input type="radio" name="${q.id}" value="${n}" data-k="${q.id}" ${String(a[q.id])===String(n)?'checked':''}><span>${n}</span></label>`).join('') +
      `</div><div class="scale-l"><span>${esc(q.minLabel)}</span><span>${esc(q.maxLabel)}</span></div>`;
  }
  const maxNote = q.max ? ` <span class="q-help">(maximum ${q.max})</span>` : '';
  return `<div class="q" id="q-${q.id}"><div class="q-text" id="t-${q.id}">${esc(q.text)}${req}${maxNote}</div>${q.help?`<div class="q-help">${esc(q.help)}</div>`:''}${body}<div class="q-err">Please answer this question${q.type==='grid'||q.type==='likert'?' (every row)':''}.</div></div>`;
}

function bind(sec){
  app.querySelectorAll('input[type=text],textarea').forEach(el => el.addEventListener('input', () => {
    state.answers[el.dataset.k] = el.value; const c = app.querySelector(`[data-count="${el.dataset.k}"]`); if (c) c.textContent = el.value.length;
    clearInvalid(el); debounceSave();
  }));
  app.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    state.answers[el.dataset.k] = el.value;
    el.closest('.opts')?.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
    clearInvalid(el); steps(); save();
  }));
  app.querySelectorAll('input[type=checkbox][data-k]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.k, q = sec.questions.find(x=>x.id===k);
    let cur = (state.answers[k] || []).slice();
    if (el.checked) {
      if (el.dataset.x === '1') cur = [el.value];
      else { cur = cur.filter(v => { const o=q.options.find(o=>o[0]===v); return o && !isExclusive(q,o[0],o[1]); }); cur.push(el.value); }
      if (q.max && cur.length > q.max) { el.checked = false; cur = cur.filter(v=>v!==el.value); toast(`Please choose up to ${q.max}.`); }
    } else cur = cur.filter(v => v !== el.value);
    state.answers[k] = cur;
    el.closest('.opts').querySelectorAll('.opt').forEach(o => { const i=o.querySelector('input'); i.checked = cur.includes(i.value); o.classList.toggle('on', i.checked); });
    clearInvalid(el); steps(); save();
  }));
}
let dt; function debounceSave(){ clearTimeout(dt); dt = setTimeout(save, 400); }
function clearInvalid(el){ el.closest('.q')?.classList.remove('invalid'); }

/* ---------------------------------------------------------- validation */
function missing(q){
  const a = state.answers;
  if (!q.required) return false;
  if (q.type==='grid'||q.type==='likert') return q.rows.some(([rk]) => !a[`${q.id}_${rk}`]);
  if (q.type==='multi') return !(a[q.id]||[]).length;
  return !String(a[q.id] ?? '').trim();
}
function totalRequired(){ return S.sections.flatMap(s=>s.questions).filter(q=>q.required).length; }
function answeredRequired(){ return S.sections.flatMap(s=>s.questions).filter(q=>q.required && !missing(q)).length; }

/* ---------------------------------------------------------- review */
function fmt(q){
  const a = state.answers;
  if (q.type==='grid'||q.type==='likert') return q.rows.map(([rk,rl])=>`${rl}: <b>${esc(a[`${q.id}_${rk}`]||'—')}</b>`).join('<br>');
  const v = a[q.id]; if (Array.isArray(v)) return v.length ? esc(v.join(' · ')) : ''; return esc(v ?? '');
}
function renderReview(){
  steps();
  const miss = S.sections.flatMap(s=>s.questions).filter(missing);
  app.innerHTML = `<div class="card">
    <div class="sec-head"><h2><span class="sec-ico">${ico('check',22)}</span>Review your answers</h2>
    <p>${miss.length ? `${miss.length} required question${miss.length>1?'s are':' is'} still unanswered — use <b>Edit</b> to complete ${miss.length>1?'them':'it'}.` : 'Everything required is answered. Check your answers, then submit.'}</p></div>
    ${S.sections.map((s,i)=>`<div class="review-sec"><h3>${esc(s.title)}<button class="btn link" data-edit="${i}">Edit</button></h3><dl>${
      s.questions.map(q=>{ const f=fmt(q), m=missing(q); return `<dt>${esc(q.short)}</dt><dd class="${m?'miss':''}">${m?'Not answered yet':(f||'<span style="color:var(--muted)">—</span>')}</dd>`; }).join('')}</dl></div>`).join('')}
    <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
  </div>`;
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { state.step = +b.dataset.edit; go(); });
  document.getElementById('back').textContent = '← Back';
  const nx = document.getElementById('next'); nx.textContent = testMode ? 'Submit (test) ✓' : 'Submit interview ✓'; nx.disabled = miss.length > 0;
}

function renderDone(){
  app.innerHTML = `<div class="card hero">
    <div class="done-ico">${ico('check',34)}</div>
    <h1>Thank you!</h1>
    <p>Your answers have been ${testMode ? '<b>recorded in test mode</b> (not sent anywhere — the site owner still needs to connect the Google Sheet)' : 'received by the student research team'}. Your time helps make our school greener.</p>
    <p class="q-help">Reference: ${esc(state.id)}</p>
    <button class="btn link" id="again">Another staff member on this device? Start a new interview</button>
  </div>`;
  document.getElementById('again').onclick = () => { Object.assign(state,{ step:-1, answers:{}, id:uid(), started:null, consent:false, submitted:false }); save(); render(); };
}

/* ---------------------------------------------------------- navigation */
function go(){ save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('back').onclick = () => { state.step = state.step <= 0 ? -1 : state.step - 1; go(); };
document.getElementById('next').onclick = async () => {
  if (state.step < nSec) {
    const sec = S.sections[state.step], bad = sec.questions.filter(missing);
    app.querySelectorAll('.q').forEach(el => el.classList.remove('invalid'));
    if (bad.length) { bad.forEach(q => document.getElementById('q-'+q.id).classList.add('invalid'));
      document.getElementById('q-'+bad[0].id).scrollIntoView({behavior:'smooth',block:'center'}); toast(`${bad.length} question${bad.length>1?'s need':' needs'} an answer`); return; }
    state.step++; return go();
  }
  await submit();
};

async function submit(){
  const btn = document.getElementById('next'); btn.disabled = true; btn.textContent = 'Sending…';
  const keys = window.surveyKeys(), answers = {}, meta = {};
  keys.forEach(({key,q,row,section}) => {
    const v = state.answers[key]; answers[key] = v === undefined ? '' : v;
    meta[key] = { short: row ? `${q.short}: ${row}` : q.short, text: row ? `${q.text} — ${row}` : q.text, section: section.title };
  });
  const payload = { id: state.id, version: S.version, minutes: state.started ? Math.round((Date.now()-state.started)/60000) : '',
                    answers, order: keys.map(k=>k.key), meta, website: document.getElementById('website')?.value || '' };
  if (testMode) { console.info('TEST MODE payload', payload); return finish(); }
  try {
    const res = await fetch(CFG.SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Server refused');
    finish();
  } catch (err) {
    // Some networks block reading the reply; send once more blind. The backend ignores duplicate IDs.
    try { await fetch(CFG.SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }); finish(); }
    catch (e2) { btn.disabled = false; btn.textContent = 'Try again ✓'; toast('Could not send — check your internet connection and try again. Your answers are saved.'); }
  }
}
function finish(){ state.submitted = true; state.step = nSec + 1; go(); }

render();
})();
</script>
</body>
</html>
